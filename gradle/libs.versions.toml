[versions]
agp = "8.7.3"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
composeBom = "2025.06.01"
# The material-icons artifacts stopped shipping in the BOM after Compose 1.7; pin the last release.
composeMaterialIcons = "1.7.8"
activityCompose = "1.9.3"
appcompat = "1.7.0"
navigationCompose = "2.8.5"
hilt = "2.55"
androidxHilt = "1.2.0"
room = "2.6.1"
kotlinxSerializationJson = "1.7.3"
coroutines = "1.9.0"
work = "2.10.0"
datastore = "1.1.1"
coil = "2.7.0"
material = "1.12.0"
coreKtx = "1.15.0"
splashscreen = "1.0.1"
lifecycle = "2.8.7"
junit = "4.13.2"
truth = "1.4.4"
robolectric = "4.15.1"
androidxTestCore = "1.6.1"
androidxTestRunner = "1.6.2"
androidxTestExtJunit = "1.2.1"
espresso = "3.6.1"
turbine = "1.2.0"
ktlintPlugin = "12.1.2"
