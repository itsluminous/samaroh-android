name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly instrumented-test run (03:30 UTC).
    - cron: '30 3 * * *'

jobs:
  check:
    name: Codegen, legal hygiene, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Verifies gradle-wrapper.jar against the official checksums so a tampered
      # wrapper can never execute in CI.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Bake the Supabase config into BuildConfig so the uploaded debug APK can
      # actually sign in. Values come from repo secrets (never committed, §6);
      # on forks the secrets are empty and the app still builds and runs fully
      # offline (empty values are safe defaults). local.properties is
      # git-ignored, so the codegen no-diff check below is unaffected.
      - name: Write Supabase config from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
          } > local.properties

      # Legal-hygiene denylist scan (§6): fails on any reference-product name.
      - name: Legal-hygiene check
        run: bash scripts/legal-check.sh

      # String codegen must be in sync: generated resources are git-ignored, so a clean
      # tree after generateStrings proves nothing generated was committed and the
      # submodule catalogs generate cleanly. Key parity is asserted by unit tests.
      - name: Generate strings & verify no diff
        run: |
          ./gradlew generateStrings
          if [ -n "$(git status --porcelain)" ]; then
            echo "generateStrings produced a working-tree diff:" >&2
            git status --porcelain >&2
            exit 1
          fi

      - name: ktlint, Android Lint, unit tests
        run: ./gradlew ktlintCheck lintDebug testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      # Every PR carries an installable debug APK for review (§9.5).
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: samaroh-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test & lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
          retention-days: 7

  # Nightly / on-demand instrumented tests on an emulator (§9.5 step 6): the W2-B e2e
  # suite in :app (Compose UI tests, en + hi, Hilt test runner). Library modules build
  # no test APKs (root build.gradle.kts disables androidTest without sources), so the
  # root task runs exactly the app suite.
  connected:
    name: Instrumented tests (emulator)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: ./gradlew --max-workers=4 connectedDebugAndroidTest
      - name: Upload connected test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: connected-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 7
